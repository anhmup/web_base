
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draw Result</title>
    <style>
        .container {
            display: flex;
            justify-content: space-between;
        }
        .image-container {
            width: 45%;
        }
        .image-container img {
            width: 100%;
        }
        .button-container {
            text-align: center;
            margin-top: 20px;
        }
        .button {
            background-color: #4169E1;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            margin-top: 10px;
        }
        .image-box img {
            max-width: 100%;  /* Ảnh không vượt quá chiều rộng của box */
            max-height: 500px; /* Giới hạn chiều cao để không quá lớn */
            width: auto;
            height: auto;
            object-fit: contain; /* Giữ nguyên tỷ lệ */
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <h1>Draw Result</h1>
    <div class="container">
        <div class="image-box">
            <h2>Image with Rectangles</h2>
            <img src="{{ drawn_image_path }}" alt="Image with Rectangles">
        </div>
        <div class="image-box">
            <h2>Original Image</h2>
            <img src="{{ original_image_path }}" alt="Original Image">
        </div>
    </div>
    <div class="button-container">
        <form action="/" method="get">
            <button type="submit" class = "button">Exit</button>
        </form>
    </div>
</body>
</html>
